<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/images/logos/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — PAGE NOT FOUND // CARLV.SION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <nav class="nav" id="nav">
    <div class="nav-logo-wrapper">
      <a class="nav-logo" href="index">CARLV.SION</a>
    </div>
    <ul class="nav-links">
      <li><a href="index">HOME</a></li>
      <li><a href="gallery">GALLERY</a></li>
      <li><a href="about">ABOUT</a></li>
    </ul>
    <div class="nav-cta">
      <a class="btn-outline" href="contact">CONTACT ME</a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="nav-drawer" id="navDrawer">
    <a href="index"    onclick="closeDrawer()">HOME</a>
    <a href="gallery"  onclick="closeDrawer()">GALLERY</a>
    <a href="about"    onclick="closeDrawer()">ABOUT</a>
    <a href="contact"  onclick="closeDrawer()" class="btn-outline" style="font-size:18px;">CONTACT ME</a>
  </div>

  <main class="error-page">
    <div class="error-bg-text">404</div>
    <div class="error-content reveal">
      <h1 class="error-title">VISION BLURRED</h1>
      <p class="error-desc">
        The page you're looking for doesn't exist or has been moved. 
        Let's refocus and get you back to the gallery.
      </p>
      <a class="btn-outline" href="index">RETURN TO HOME</a>
    </div>
  </main>

  <script>
    /* ── Nav scroll ── */
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 40);
    });

    /* ── Hamburger ── */
    const hamburger = document.getElementById('hamburger');
    const drawer    = document.getElementById('navDrawer');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      drawer.classList.toggle('open');
      document.body.style.overflow = drawer.classList.contains('open') ? 'hidden' : '';
    });
    function closeDrawer() {
      hamburger.classList.remove('open');
      drawer.classList.remove('open');
      document.body.style.overflow = '';
    }

    /* ── Scroll reveal ── */
    const reveals = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.12 });
    reveals.forEach(el => observer.observe(el));
  </script>
</body>
</html>
